name: Deploy to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: perl -pi -e "s/APP_VERSION = '[^']*'/APP_VERSION = '${GITHUB_REF_NAME#v}'/" app.js

      - name: Collect site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js id3.js formats.js LICENSE _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
